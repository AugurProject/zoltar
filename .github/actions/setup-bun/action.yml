name: Set up pinned Bun
description: Read the repository package manager version and install it
runs:
  using: composite
  steps:
    - name: Read Bun version
      id: version
      shell: bash
      run: |
        version=$(jq -er '.packageManager | capture("^bun@(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version' package.json)
        echo "BUN_VERSION=${version}" >> "$GITHUB_ENV"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.version.outputs.version }}
