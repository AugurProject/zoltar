name: Build and Push to IPFS

on:
  workflow_run:
    workflows: [CI Gate]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ipfs-build-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish IPFS Image
    needs: validate-manual
    outputs:
      image-name: ${{ steps.metadata.outputs.image-name }}
      candidate-sha: ${{ steps.metadata.outputs.candidate-sha }}
    runs-on: ubuntu-latest
    if: always() && ((github.event_name == 'workflow_dispatch' && needs.validate-manual.result == 'success') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Set image metadata
        id: metadata
        run: |
          IMAGE_NAME="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "IMAGE_RELEASE_ID=${IMAGE_NAME}:sha-${CANDIDATE_SHA}" >> "$GITHUB_ENV"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "candidate-sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=zoltar-ipfs
          cache-to: type=gha,mode=max,scope=zoltar-ipfs
          context: .
          file: ui/Dockerfile
          load: true
          tags: ${{ env.IMAGE_RELEASE_ID }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "${IMAGE_RELEASE_ID}"

  promote:
    name: Promote validated main image
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: ipfs-latest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote current main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ needs.publish.outputs.candidate-sha }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
        run: |
          CURRENT_MAIN=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "${CANDIDATE_SHA}" != "${CURRENT_MAIN}" ]]; then
            echo 'A newer main revision exists; retaining the immutable image without promoting latest.'
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:sha-${CANDIDATE_SHA}"
