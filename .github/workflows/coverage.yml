name: Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  FOUNDRY_VERSION: v1.5.1

jobs:
  coverage:
    name: Full coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Run TypeScript and Solidity coverage
        run: bun run coverage:full
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.md ]]; then
            cat coverage/coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Coverage summary was not produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage
            solidity/coverage
          if-no-files-found: warn
          retention-days: 14
