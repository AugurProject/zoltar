name: Test Domains

on:
  workflow_call:
    inputs:
      solidity:
        description: Run Solidity tests.
        type: boolean
        default: true
      prepared:
        description: Reuse the caller's domain-production-ui artifact and preflight checks.
        type: boolean
        default: false
      application:
        description: Run application preparation, tests, and mutation smoke alongside Solidity.
        required: false
        type: boolean
        default: true
      invocation:
        description: Identifies the caller in concurrency groups.
        required: false
        type: string
        default: reusable
  workflow_dispatch:
    inputs:
      solidity:
        description: Run Solidity tests.
        type: boolean
        default: true
      application:
        description: Run application preparation, tests, and mutation smoke alongside Solidity.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: test-domains-${{ inputs.invocation || 'direct' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  FOUNDRY_VERSION: v1.5.1

jobs:
  prepare:
    name: Prepare domain test inputs
    if: inputs.application && !inputs.prepared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
      - name: Verify complete test ownership
        run: bun run test:preflight
      - name: TypeScript checks and production UI build
        run: |
          bun run ui:build:apps
          bun ./tooling/repo/install-frozen.mts ui/statoblast
          bun run ci:preflight:current
      - name: Read canonical UI artifact metadata
        id: projects
        run: bun ./tooling/repo/query-projects.mts --github-output
      - uses: actions/upload-artifact@v4
        with:
          name: domain-production-ui
          path: ${{ steps.projects.outputs.ui_artifact_outputs }}
          if-no-files-found: error
          retention-days: 1

  application-tests:
    name: Application tests (${{ matrix.shard }}/4)
    needs: prepare
    if: always() && !cancelled() && inputs.application && (needs.prepare.result == 'success' || (inputs.prepared && needs.prepare.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: domain-production-ui
          path: ui
      - name: Refresh split UI package installs
        run: bun ./tooling/repo/run-project-tasks.mts setup --path-prefix ui/
      - uses: actions/cache/restore@v5
        with:
          path: .ci/test-timings-application.json
          key: ${{ runner.os }}-test-timings-v2-application-${{ github.sha }}
          restore-keys: ${{ runner.os }}-test-timings-v2-application-
      - name: Run balanced application shard
        env:
          ZOLTAR_USE_EXISTING_PRODUCTION_BUILD: "1"
          ZOLTAR_TEST_TIMING_HISTORY: .ci/test-timings-application.json
          ZOLTAR_TEST_TIMING_OUTPUT: test-results/application-${{ matrix.shard }}.timing.json
        run: bun run test:run:balanced-shard -- --bail=1 --parallel=1 --domain=application --shard="${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-test-timing-${{ matrix.shard }}
          path: test-results/application-${{ matrix.shard }}.timing.json
          if-no-files-found: error
          retention-days: 1

  solidity-tests:
    name: Solidity tests (${{ matrix.shard }}/4)
    if: inputs.solidity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          profile: contracts
      - uses: actions/cache/restore@v5
        with:
          path: .ci/test-timings-solidity.json
          key: ${{ runner.os }}-test-timings-v2-solidity-${{ github.sha }}
          restore-keys: ${{ runner.os }}-test-timings-v2-solidity-
      - name: Run balanced Solidity shard
        env:
          ZOLTAR_TEST_TIMING_HISTORY: .ci/test-timings-solidity.json
          ZOLTAR_TEST_TIMING_OUTPUT: test-results/solidity-${{ matrix.shard }}.timing.json
        run: bun run test:run:balanced-shard -- --bail=1 --parallel=1 --domain=solidity --shard="${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solidity-test-timing-${{ matrix.shard }}
          path: test-results/solidity-${{ matrix.shard }}.timing.json
          if-no-files-found: error
          retention-days: 1

  timing-history:
    name: Update ${{ matrix.domain }} timing history
    needs: [application-tests, solidity-tests]
    if: always() && !cancelled() && (needs.solidity-tests.result == 'success' || needs.application-tests.result == 'success') && (needs.solidity-tests.result == 'success' || needs.solidity-tests.result == 'skipped') && (needs.application-tests.result == 'success' || needs.application-tests.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: ${{ fromJSON(needs.application-tests.result != 'success' && '["solidity"]' || (needs.solidity-tests.result == 'success' && '["application", "solidity"]' || '["application"]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: .ci/test-timings-${{ matrix.domain }}.json
          key: ${{ runner.os }}-test-timings-v2-${{ matrix.domain }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-test-timings-v2-${{ matrix.domain }}-
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ matrix.domain }}-test-timing-*
          path: test-results
          merge-multiple: true
      - run: bun ./tooling/testing/merge-test-timings.mts --observations test-results --history ".ci/test-timings-${{ matrix.domain }}.json"
      - uses: actions/cache/save@v5
        with:
          path: .ci/test-timings-${{ matrix.domain }}.json
          key: ${{ runner.os }}-test-timings-v2-${{ matrix.domain }}-${{ github.sha }}

  mutation-smoke:
    name: Critical mutation smoke
    if: inputs.application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          profile: root
          foundry: "false"
      - run: bun run test:mutation:smoke

  required:
    name: Required domain results
    if: always()
    needs: [prepare, application-tests, solidity-tests, timing-history, mutation-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected domains
        env:
          SOLIDITY_SELECTED: ${{ inputs.solidity }}
          PREPARED: ${{ inputs.prepared }}
          APPLICATION_SELECTED: ${{ inputs.application }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          APPLICATION_RESULT: ${{ needs.application-tests.result }}
          SOLIDITY_RESULT: ${{ needs.solidity-tests.result }}
          TIMING_RESULT: ${{ needs.timing-history.result }}
          MUTATION_RESULT: ${{ needs.mutation-smoke.result }}
        run: |
          require_result() {
            local selected="$1" result="$2" label="$3"
            local expected="skipped"
            if [[ "${selected}" == "true" ]]; then expected="success"; fi
            if [[ "${result}" != "${expected}" ]]; then
              echo "${label} ended as ${result}; expected ${expected}."
              exit 1
            fi
          }
          [[ "${APPLICATION_SELECTED}" == "true" || "${SOLIDITY_SELECTED}" == "true" ]] || exit 1
          require_result "${SOLIDITY_SELECTED}" "${SOLIDITY_RESULT}" solidity
          require_result "${APPLICATION_SELECTED}" "${APPLICATION_RESULT}" application
          require_result "${APPLICATION_SELECTED}" "${MUTATION_RESULT}" mutation
          prepare_selected="false"
          if [[ "${APPLICATION_SELECTED}" == "true" && "${PREPARED}" != "true" ]]; then prepare_selected="true"; fi
          require_result "${prepare_selected}" "${PREPARE_RESULT}" prepare
          [[ "${TIMING_RESULT}" == "success" ]] || exit 1
