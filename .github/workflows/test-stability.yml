name: Test Stability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-stability-${{ github.ref }}
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  repeat-timing-sensitive-tests:
    name: Repeat timing-sensitive tests (${{ matrix.iteration }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Exercise deterministic polling and lifecycle boundaries
        run: >-
          bun test --preload ./bun-test-setup-ui.ts --timeout 300000
          tooling/docs/documentation-tools-runtime.test.ts
          tooling/ui/chromiumPath.test.ts
          ui/statoblast/ts/tests/features/open-oracle/useRepPrices.test.tsx
      - name: Exercise AugurScan lifecycle concurrency
        working-directory: augurScan
        run: bun test tests/replay/indexer-lifecycle.test.ts tests/api/live.test.ts
      - name: Publish repeat metadata
        run: echo "Completed stability iteration ${{ matrix.iteration }} without retries." >> "${GITHUB_STEP_SUMMARY}"
