name: Version deploy

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  packages: write

concurrency:
  group: version-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  REGISTRY: ghcr.io

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - name: Require v<number>
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${VERSION_TAG}" =~ ^v[0-9]+$ ]]; then
            echo "Version tags must match v<number>; received ${VERSION_TAG}" >&2
            exit 1
          fi

  tests:
    name: Run all tests
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Publish IPFS apps and release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set image metadata
        shell: bash
        run: |
          IMAGE_ROOT="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "PUBLISHER_IMAGE=${IMAGE_ROOT}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build IPFS publisher
        uses: docker/build-push-action@v6
        with:
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=zoltar-version-ipfs
          cache-to: type=gha,mode=max,scope=zoltar-version-ipfs
          context: .
          file: ui/Dockerfile
          load: true
          target: publisher
          tags: ${{ env.PUBLISHER_IMAGE }}

      - name: Read content identifier
        shell: bash
        run: |
          IPFS_CID=$(docker run --rm --entrypoint /bin/sh "${PUBLISHER_IMAGE}" -c 'cat /ipfs_hash.txt')
          [[ "${IPFS_CID}" =~ ^bafy[a-z2-7]+$ ]]
          echo "IPFS_CID=${IPFS_CID}" >> "$GITHUB_ENV"

      - name: Push versioned publisher image
        run: docker push "${PUBLISHER_IMAGE}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          GENERATED_NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body')

          cat > release-notes.md <<EOF
          ## IPFS applications

          The versioned publisher image contains the exact static files represented by this content identifier:

          \`${IPFS_CID}\`

          - [Zoltar — ipfs://${IPFS_CID}/zoltar/](ipfs://${IPFS_CID}/zoltar/)
          - [Augur Statoblast — ipfs://${IPFS_CID}/statoblast/](ipfs://${IPFS_CID}/statoblast/)
          - [Trading — ipfs://${IPFS_CID}/trading/](ipfs://${IPFS_CID}/trading/)
          - [Zoltar gateway](https://${IPFS_CID}.ipfs.w3s.link/zoltar/)
          - [Augur Statoblast gateway](https://${IPFS_CID}.ipfs.w3s.link/statoblast/)
          - [Trading gateway](https://${IPFS_CID}.ipfs.w3s.link/trading/)

          ${GENERATED_NOTES}
          EOF

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --latest
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --latest --verify-tag
          fi
