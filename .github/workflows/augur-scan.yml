name: AugurScan

on:
  pull_request:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  push:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, static checks, and browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: augur_scan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d augur_scan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: augurScan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: PostgreSQL integration tests
        run: bun run test:integration
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/augur_scan_test
      - name: Static checks
        run: bun run check
      - name: Build browser application
        run: bun run build
