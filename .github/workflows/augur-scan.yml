name: AugurScan

on:
  pull_request:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  push:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, static checks, and browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: augurScan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Prepare canonical contract metadata
        working-directory: .
        run: bun run setup-contracts
      - name: Static checks
        run: bun run check
      - name: Build browser application
        run: bun run build
