<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Zoltar + Augur Statoblast</title>
		<!-- Apply a saved theme before the stylesheets load so the page never paints the other palette first; keep in sync with ui/coreShared/ts/lib/themePreference.ts. -->
		<script>
			try {
				const theme = localStorage.getItem("zoltar.theme");
				if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		<link rel="stylesheet" href="./css/index.css" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
	</head>
	<body style>
		<main>Loading...</main>

		<script async type="module" src="./assets/app.js"></script>
	</body>
</html>
