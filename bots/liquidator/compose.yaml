name: zoltar-liquidator

services:
  liquidator:
    build:
      context: ../..
      dockerfile: bots/liquidator/Dockerfile
    image: zoltar-liquidator
    environment:
      ZOLTAR_BOT_DASHBOARD_PASSWORD: ${ZOLTAR_BOT_DASHBOARD_PASSWORD:-zoltar-local-dashboard}
    ports:
      - 127.0.0.1:4183:4183
    volumes:
      - liquidator-state:/app/bots/liquidator/.state

volumes:
  liquidator-state:
