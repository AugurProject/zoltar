name: zoltar-liquidator

services:
  liquidator:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: bots/liquidator/Dockerfile
    image: zoltar-liquidator
    environment:
      ZOLTAR_BOT_DASHBOARD_PASSWORD: ${ZOLTAR_BOT_DASHBOARD_PASSWORD:-zoltar-local-dashboard}
    ports:
      - 127.0.0.1:4183:4183
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:4183/healthz'); if (!response.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - liquidator-state:/app/bots/liquidator/.state

volumes:
  liquidator-state:
