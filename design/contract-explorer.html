<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Explore Zoltar production contracts, their source, and the calls between them." />
		<title>Zoltar contract explorer</title>
		<style>
			:root {
				color-scheme: light;
				font:
					16px / 1.45 system-ui,
					sans-serif;
				--ink: #14263d;
				--muted: #475d76;
				--hair: #d3dfea;
				--bg: #f3f7fb;
				--accent: #17556d;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
			}
			main {
				max-width: 1840px;
				margin: auto;
				padding: 36px clamp(14px, 3vw, 44px);
			}
			h1,
			h2,
			h3,
			p {
				margin: 0;
			}
			h1 {
				font-size: clamp(1.8rem, 4vw, 2.9rem);
				letter-spacing: -0.04em;
			}
			h2 {
				font-size: 1.15rem;
			}
			h3 {
				font-size: 1rem;
			}
			button,
			input,
			select {
				font: inherit;
			}
			button {
				cursor: pointer;
			}
			button:focus-visible,
			input:focus-visible,
			select:focus-visible,
			[tabindex]:focus-visible {
				outline: 3px solid #007b91;
				outline-offset: 3px;
			}
			.muted {
				color: var(--muted);
			}
			.subtitle {
				margin: 0.3rem 0 1.55rem;
			}
			.control-button {
				background: white;
				color: var(--accent);
				border: 1px solid #a7b9ca;
				border-radius: 8px;
				padding: 0.52rem 0.75rem;
			}
			.layout {
				display: grid;
				grid-template-columns: minmax(0, 2.4fr) minmax(265px, 1fr);
				gap: 14px;
				align-items: start;
			}
			.panel {
				border: 1px solid var(--hair);
				border-radius: 14px;
				background: white;
				overflow: hidden;
			}
			.topline {
				padding: 13px 16px;
				border-bottom: 1px solid var(--hair);
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 10px;
			}
			.graph-wrap {
				overflow: auto;
				max-height: 84vh;
				background: linear-gradient(#f8fbfd, #fff);
			}
			svg {
				display: block;
				width: 100%;
				min-width: 720px;
			}
			svg .edge {
				cursor: pointer;
			}
			svg .edge .stroke {
				stroke: #55738e;
				stroke-width: 2.6;
				fill: none;
			}
			svg .edge.support .stroke {
				stroke-dasharray: 6 5;
				stroke: #798497;
			}
			svg .edge.active .stroke,
			svg .edge:hover .stroke,
			svg .edge:focus-visible .stroke {
				stroke: #006d79;
				stroke-width: 4;
			}
			svg .edge.dim {
				opacity: 0.3;
			}
			svg .node {
				cursor: pointer;
			}
			svg .node:hover rect,
			svg .node:focus-visible rect {
				stroke: #006d79;
				stroke-width: 3;
			}
			svg text {
				pointer-events: none;
			}
			.side {
				padding: 16px;
				max-height: 84vh;
				overflow: auto;
			}
			.side header {
				margin-bottom: 12px;
			}
			.context {
				font-size: 0.86rem;
				color: var(--muted);
				overflow-wrap: anywhere;
			}
			.side ul {
				padding: 0;
				margin: 0.5rem 0 1rem;
				list-style: none;
			}
			.side li {
				margin: 0 0 6px;
			}
			.link-button {
				width: 100%;
				text-align: left;
				border: 1px solid #d1dfec;
				background: #f6fafe;
				color: var(--ink);
				border-radius: 7px;
				padding: 0.43rem 0.55rem;
				overflow-wrap: anywhere;
			}
			.link-button:hover,
			.link-button[aria-current] {
				background: #e1f2f4;
				border-color: #689eac;
			}
			.kind {
				font-size: 0.82rem;
				color: #355d73;
				font-weight: 700;
				margin-top: 0.6rem;
			}
			.calls {
				font-size: 0.84rem;
			}
			.calls li {
				border-bottom: 1px solid #e6eef5;
				padding: 0.3rem 0;
				overflow-wrap: anywhere;
			}
			code {
				font:
					0.81rem ui-monospace,
					monospace;
			}
			.exclusion {
				margin-top: 12px;
				font-size: 0.84rem;
			}
			.hint {
				font-size: 0.86rem;
			}
			.empty {
				padding: 22px 16px;
				color: var(--muted);
			}
			@media (max-width: 950px) {
				.layout {
					grid-template-columns: minmax(0, 1fr);
				}
				.graph-wrap {
					max-height: 72vh;
				}
				.side {
					max-height: none;
				}
			}
			@media (prefers-reduced-motion: no-preference) {
				.link-button {
					transition: background 0.15s;
				}
			}

			.navigation {
				display: flex;
				gap: 12px;
				align-items: center;
				margin-bottom: 10px;
			}
			.navigation h2 {
				font-size: 1.45rem;
				overflow-wrap: anywhere;
			}
			.navigation h2:focus {
				outline: none;
			}
			.view-intro {
				margin-bottom: 14px;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			.topline .hint {
				overflow-wrap: anywhere;
			}
			.node.current {
				cursor: default;
			}
			.tree-wrap {
				overflow: auto;
				background: #f8fbfe;
			}
			.tree-wrap svg {
				min-width: 0;
				font-family: system-ui, sans-serif;
			}
			.tree-node:hover rect:first-of-type,
			.tree-node:focus-visible rect:first-of-type {
				fill: #edf7fa;
			}
			.tree-node:hover rect:nth-of-type(2),
			.tree-node:focus-visible rect:nth-of-type(2) {
				stroke: none;
			}
			.layout {
				grid-template-columns: minmax(0, 1fr);
			}
			.graph-wrap svg {
				min-width: 0;
			}
			.graph-wrap {
				max-height: 86vh;
			}
			.side {
				max-height: none;
			}
			.side > div:has(button[data-connection]) {
				columns: 3 270px;
				column-gap: 20px;
			}
			.side h3 {
				break-after: avoid;
			}
			.side li {
				break-inside: avoid;
			}
			.navigation {
				position: sticky;
				top: 0;
				z-index: 2;
				background: var(--bg);
				padding: 6px 0;
			}
			.side:focus {
				outline: none;
			}
			@media (max-width: 650px) {
				.side > div:has(button[data-connection]) {
					columns: auto;
				}
				.graph-wrap {
					max-height: 73vh;
				}
			}
			.zoom-bar {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 0 0 10px;
			}
			.zoom-bar output {
				font-variant-numeric: tabular-nums;
				min-width: 55px;
				text-align: center;
			}
			.zoom-bar .control-button {
				min-height: 40px;
				min-width: 40px;
			}
			.world-wrap {
				height: clamp(450px, 77vh, 1040px);
				background: #f9fcff;
				overflow: hidden;
			}
			.world-wrap svg {
				width: 100%;
				height: 100%;
				min-width: 0;
				touch-action: none;
				cursor: grab;
				font-family: system-ui, sans-serif;
			}
			.world-wrap svg:active {
				cursor: grabbing;
			}
			.world-wrap .world-node:focus-visible {
				outline: none;
			}
			.world-wrap .world-node:focus-visible rect,
			.world-wrap .world-node:hover rect {
				stroke: #008299;
				stroke-width: 3;
			}
			.overview-inspector {
				background: #fff;
				border: 1px solid var(--hair);
				border-radius: 10px;
				margin-bottom: 10px;
				padding: 10px 14px;
			}
			.overview-inspector p {
				margin: 0;
			}
			.overview-inspector-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				flex-wrap: wrap;
			}
			.overview-inspector-head h3 {
				font-size: 1.06rem;
				overflow-wrap: anywhere;
				color: var(--ink);
			}
			.overview-description {
				color: var(--ink);
				margin: 0.35rem 0 !important;
			}
			.direction-legend {
				display: flex;
				gap: 12px;
				align-items: center;
				flex-wrap: wrap;
				font-size: 0.84rem;
				font-weight: 650;
			}
			.direction-legend .incoming {
				color: #235cae;
			}
			.direction-legend .outgoing {
				color: #00766d;
			}
			.direction-legend .self {
				color: #7750a0;
			}
			.clear-selection {
				border: 0;
				background: transparent;
				color: #405971;
				padding: 0;
				text-decoration: underline;
			}
			.world-wrap .world-routes,
			.world-wrap .world-active-routes {
				pointer-events: none;
			}
			.world-wrap.has-selection .world-routes {
				opacity: 0.17;
			}
			.world-wrap.has-selection .world-node[data-item^='node-']:not(.overview-connected):not(.overview-selected) {
				opacity: 0.48;
			}
			.world-wrap .overview-selected rect {
				fill: #d8f5f2;
				stroke: #006e69;
				stroke-width: 3;
			}
			.world-wrap .overview-connected:not(.overview-selected) rect {
				stroke-width: 2;
			}
			.contract-summary {
				margin: 0 0 7px;
				font-size: 1.02rem;
			}
			.source-actions {
				display: flex;
				align-items: center;
				gap: 10px;
				flex-wrap: wrap;
			}
			.source-link {
				color: #17556d;
				font-weight: 650;
				text-underline-offset: 3px;
			}
			.source-link:hover {
				color: #00766d;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Zoltar contract explorer</h1>
			<p class="subtitle muted">Zoom or drag the system graph. Click a contract to highlight its connections.</p>
			<div class="navigation">
				<button class="control-button" id="back" type="button" hidden>← Back</button>
				<h2 id="location-title" tabindex="-1"></h2>
			</div>
			<p class="sr-only" id="announcement" aria-live="polite"></p>
			<div id="content"></div>
			<p class="exclusion muted">Production source map. Interface names appear only where the source leaves a target unresolved. Tests are excluded.</p>
		</main>

					svg('title', {}, group, node.name)
					const inactiveFill = node.external ? '#eef3f7' : '#fff'
					svg('rect', { x, y, width: w, height: h, rx: 8, fill: current ? color : inactiveFill, stroke: color, 'stroke-width': edge?.id === selectedEdge ? 3 : 1.4, 'stroke-dasharray': node.external ? '5 3' : 'none' }, group)
					svg('text', { x: x + w / 2, y: current && h > 52 ? y + 27 : y + h / 2 + 5, 'text-anchor': 'middle', 'font-family': 'system-ui,sans-serif', 'font-size': Math.max(9, Math.min(current ? 16 : 14, Math.floor((w - 20) / (node.name.length * 0.58)))), fill: current ? 'white' : '#14263d', 'font-weight': 650 }, group, node.name)
					if (current) return
					const action = node.external ? () => connection(id, edge.id) : () => contract(node.id)
					groupButton(group, node.external ? 'Inspect ' + node.name : 'Explore ' + node.name, action)
					group.addEventListener('click', action)
				}
				for (const { node, x, y, w, edge } of routes) drawNode(node, x, y, w, 34, false, edge)
				if (stacked) drawNode(allNodes.get(id), 12, 12, width - 24, 39, true)
				else drawNode(allNodes.get(id), centerX, nodeY, centerW, centerHeight, true)
				if (!routes.length && !self.length) svg('text', { x: width / 2, y: height - 33, 'text-anchor': 'middle', fill: '#475d76', 'font-size': 14 }, canvas, 'No mapped connections.')
				// Resolve hits by the closest curve rather than whichever transparent SVG stroke is painted last.
				canvas.addEventListener('click', (event) => {
					if (event.target.closest('.node')) return
					const matrix = canvas.getScreenCTM()
					if (!matrix) return
					const pointer = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse())
					const limit = (10 / Math.hypot(matrix.a, matrix.b)) ** 2
					let best = limit,
						result
					for (const hit of hits) {
						const { visible, length, edge } = hit
						const distance = (t) => {
							const p = visible.getPointAtLength(t)
							return (p.x - pointer.x) ** 2 + (p.y - pointer.y) ** 2
						}
						let nearest = Infinity,
							at = 0
						for (let i = 0; i <= 24; i++) {
							const t = (length * i) / 24
							const d = distance(t)
							if (d < nearest) {
								nearest = d
								at = t
							}
						}
						let lo = Math.max(0, at - length / 24),
							hi = Math.min(length, at + length / 24)
						for (let i = 0; i < 16; i++) {
							const left = (2 * lo + hi) / 3,
								right = (lo + 2 * hi) / 3
							if (distance(left) < distance(right)) hi = right
							else lo = left
						}
						const d = distance((lo + hi) / 2)
						if (d < best) {
							best = d
							result = edge
						}
					}
					if (result) connection(id, result.id)
				})
			}
			function renderContract() {
				const id = view.id
				const node = allNodes.get(id)
				const current = view.type === 'connection' ? edges.get(view.edge) : undefined
				const connections = related(id)
				const source = make('div', undefined, { class: 'view-intro context source-actions' })
				source.append(make('span', data.groups[node.group].name + ' · ' + node.source), sourceLink(node))
				content.append(make('p', node.summary, { class: 'contract-summary' }), source)
				const layout = make('div', undefined, { class: 'layout' })
				const panel = make('section', undefined, { class: 'panel' })
				const header = make('div', undefined, { class: 'topline' })
				header.append(make('h2', 'Connections'), make('span', current ? 'Selected: ' + edgeLabel(current) : 'Click a contract or arrow', { class: 'hint muted' }))
				const graph = make('div', undefined, { class: 'graph-wrap', id: 'graph' })
				panel.append(header, graph)
				const side = make('aside', undefined, { class: 'panel side', id: 'details', 'aria-label': 'Connection details' })
				side.append(current ? edgeDetails(id, current) : edgeList(id, connections))
				layout.append(panel, side)
				content.append(layout)
				let graphWidth
				const paint = () => {
					if (!graph.isConnected || graphWidth === graph.clientWidth) return
					graphWidth = graph.clientWidth
					graph.replaceChildren()
					drawGraph(graph, id, connections, current?.id)
				}
				hierarchyObserver = new ResizeObserver(paint)
				hierarchyObserver.observe(graph)
				paint()
				if (current) side.scrollIntoView({ block: 'nearest' })
			}
			function render(focus = false) {
				hierarchyObserver?.disconnect()
				content.replaceChildren()
				back.hidden = !trail.length
				let title = 'Subsystems'
				if (view.type === 'subsystem') title = data.groups[view.id].name
				else if (view.type !== 'system') title = allNodes.get(view.id).name
				locationTitle.textContent = title
				content.dataset.view = view.type
				if (view.type === 'system') renderSystem()
				else if (view.type === 'subsystem') renderSubsystem()
				else renderContract()
				live.textContent = view.type === 'connection' ? edgeLabel(edges.get(view.edge)) : title
				if (focus) {
					if (view.type === 'connection') document.getElementById('details').setAttribute('tabindex', '-1')
					const focusTarget = view.type === 'connection' ? document.getElementById('details') : locationTitle
					focusTarget.focus({ preventScroll: view.type === 'connection' })
					if (view.type !== 'connection') window.scrollTo(0, 0)
				}
			}
			render()
		</script>
	</body>
</html>
