name: Version deploy

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  packages: write

concurrency:
  group: version-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  REGISTRY: ghcr.io

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - name: Require v<number>
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${VERSION_TAG}" =~ ^v[0-9]+$ ]]; then
            echo "Version tags must match v<number>; received ${VERSION_TAG}" >&2
            exit 1
          fi

  tests:
    name: Run all tests
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Publish IPFS apps and release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set image metadata
        shell: bash
        run: |
          IMAGE_ROOT="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "ZOLTAR_IMAGE=${IMAGE_ROOT}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "TRADING_IMAGE=${IMAGE_ROOT}-trading:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Zoltar IPFS publisher
        uses: docker/build-push-action@v6
        with:
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=zoltar-version-ipfs
          cache-to: type=gha,mode=max,scope=zoltar-version-ipfs
          context: .
          file: ui/Dockerfile
          load: true
          tags: ${{ env.ZOLTAR_IMAGE }}

      - name: Build trading IPFS publisher
        uses: docker/build-push-action@v6
        with:
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=trading-version-ipfs
          cache-to: type=gha,mode=max,scope=trading-version-ipfs
          context: .
          file: trading/Dockerfile
          load: true
          target: publisher
          tags: ${{ env.TRADING_IMAGE }}

      - name: Read content identifiers
        shell: bash
        run: |
          ZOLTAR_CID=$(docker run --rm --entrypoint /bin/sh "${ZOLTAR_IMAGE}" -c 'cat /ipfs_hash.txt')
          TRADING_CID=$(docker run --rm --entrypoint /bin/sh "${TRADING_IMAGE}" -c 'cat /ipfs_hash.txt')
          [[ "${ZOLTAR_CID}" =~ ^bafy[a-z2-7]+$ ]]
          [[ "${TRADING_CID}" =~ ^bafy[a-z2-7]+$ ]]
          echo "ZOLTAR_CID=${ZOLTAR_CID}" >> "$GITHUB_ENV"
          echo "TRADING_CID=${TRADING_CID}" >> "$GITHUB_ENV"

      - name: Push versioned publisher images
        run: |
          docker push "${ZOLTAR_IMAGE}"
          docker push "${TRADING_IMAGE}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          GENERATED_NOTES=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body')

          cat > release-notes.md <<EOF
          ## IPFS applications

          The versioned publisher images contain the exact static files represented by these content identifiers.

          ### Zoltar

          \`${ZOLTAR_CID}\`

          - [ipfs://${ZOLTAR_CID}](ipfs://${ZOLTAR_CID}) (recommended; requires an IPFS-capable browser)
          - [https://${ZOLTAR_CID}.ipfs.dweb.link](https://${ZOLTAR_CID}.ipfs.dweb.link)
          - [https://${ZOLTAR_CID}.ipfs.w3s.link](https://${ZOLTAR_CID}.ipfs.w3s.link)

          ### Trading

          \`${TRADING_CID}\`

          - [ipfs://${TRADING_CID}](ipfs://${TRADING_CID}) (recommended; requires an IPFS-capable browser)
          - [https://${TRADING_CID}.ipfs.dweb.link](https://${TRADING_CID}.ipfs.dweb.link)
          - [https://${TRADING_CID}.ipfs.w3s.link](https://${TRADING_CID}.ipfs.w3s.link)

          ${GENERATED_NOTES}
          EOF

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --latest
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --latest --verify-tag
          fi
