name: AugurScan

on:
  pull_request:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  push:
    branches: [main]
    paths:
      - "augurScan/**"
      - "shared/ts/ethereum.ts"
      - ".github/workflows/augur-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  checks:
    name: Typecheck, unit tests, static checks, and browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: augurScan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up component dependencies
        uses: ./.github/actions/setup-component
        with:
          directory: augurScan
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Static checks
        run: bun run check
      - name: Build browser application
        run: bun run build
