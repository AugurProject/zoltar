name: Build and Push to IPFS

on:
  workflow_run:
    workflows: [CI Gate]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ipfs-build-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish IPFS Image
    needs: validate-manual
    outputs:
      image-name: ${{ steps.image.outputs.image-name }}
      candidate-sha: ${{ steps.candidate.outputs.candidate-sha }}
    runs-on: ubuntu-latest
    if: always() && ((github.event_name == 'workflow_dispatch' && needs.validate-manual.result == 'success') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Read candidate revision
        id: candidate
        run: echo "candidate-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: image
        uses: ./.github/actions/build-ui-image
        with:
          registry: ${{ env.REGISTRY }}
          tag: sha-${{ steps.candidate.outputs.candidate-sha }}
          file: ui/Dockerfile
          cache-scope: zoltar-ipfs

      - name: Push image
        env:
          IMAGE_RELEASE_ID: ${{ steps.image.outputs.image }}
        run: docker push "${IMAGE_RELEASE_ID}"

  promote:
    name: Promote validated main image
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: ipfs-latest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote current main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ needs.publish.outputs.candidate-sha }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
        run: |
          CURRENT_MAIN=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "${CANDIDATE_SHA}" != "${CURRENT_MAIN}" ]]; then
            echo 'A newer main revision exists; retaining the immutable image without promoting latest.'
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:sha-${CANDIDATE_SHA}"
