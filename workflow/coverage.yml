name: Coverage

# Full coverage is resource-intensive; run this workflow only by manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  coverage:
    name: Full coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Run TypeScript and Solidity coverage
        run: bun run coverage:full
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.md ]]; then
            cat coverage/coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Coverage summary was not produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage
            solidity/coverage
          if-no-files-found: warn
          retention-days: 14
