name: Set up Zoltar CI proposal
description: Install pinned tools and dependencies, then restore or generate build inputs

inputs:
  profile:
    description: Dependency and artifact scope (full, contracts, or root).
    required: false
    default: full
  foundry:
    description: Install Foundry for jobs that execute EVM tests.
    required: false
    default: "true"
  verify-generated:
    description: Always regenerate and verify generated inputs
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate setup profile
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        VERIFY_GENERATED: ${{ inputs.verify-generated }}
      run: |
        case "${PROFILE}" in full|contracts|root) ;; *) echo "Unknown setup profile: ${PROFILE}"; exit 1 ;; esac
        if [[ "${VERIFY_GENERATED}" == "true" && "${PROFILE}" != "full" ]]; then
          echo 'Generated freshness verification requires the full profile.'
          exit 1
        fi

    - name: Fetch repository comparison history
      if: github.job == 'checks'
      shell: bash
      run: |
        if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          git fetch --no-tags --prune --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
        elif ! git rev-parse --verify --quiet refs/remotes/origin/main; then
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Setup Foundry / Anvil
      if: inputs.foundry == 'true' && inputs.profile != 'root'
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: ${{ env.FOUNDRY_VERSION }}

    - name: Read canonical project metadata
      id: projects
      shell: bash
      run: bun ./tooling/repo/query-projects.mts --github-output

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ steps.projects.outputs.dependency_cache_key }}

    - name: Install dependencies
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        if [[ "${PROFILE}" == "full" ]]; then
          bun run projects:setup
        else
          bun ./tooling/repo/run-project-tasks.mts setup repository
          if [[ "${PROFILE}" == "contracts" ]]; then
            bun ./tooling/repo/run-project-tasks.mts setup contracts --dependencies
          else
            bun ./tooling/repo/run-project-tasks.mts setup --path-prefix shared/
          fi
        fi

    - name: Cache generated project outputs
      if: inputs.profile != 'root'
      id: generated-cache
      uses: actions/cache@v5
      with:
        path: ${{ inputs.profile == 'contracts' && steps.projects.outputs.component_artifact_outputs || steps.projects.outputs.generated_cache_paths }}
        key: ${{ runner.os }}-generated-${{ inputs.profile }}-${{ env.BUN_VERSION }}-${{ env.FOUNDRY_VERSION }}-${{ steps.projects.outputs.generated_cache_key }}

    - name: Generate and verify generated artifacts
      if: inputs.profile != 'root' && (inputs.verify-generated == 'true' || steps.generated-cache.outputs.cache-hit != 'true')
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        if [[ "${PROFILE}" == "contracts" ]]; then
          bun ./tooling/contracts/ensure-contract-artifacts.mts --headless
        else
          bun run check:generated-clean
        fi

    - name: Refresh generated shared package installs
      if: inputs.profile != 'root'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        if [[ "${PROFILE}" == "contracts" ]]; then
          bun ./tooling/repo/ensure-shared-package-fresh.mts --refresh
          (cd solidity && bun ../tooling/repo/ensure-shared-package-fresh.mts --refresh)
        else
          bun run refresh:shared-dependencies
        fi
