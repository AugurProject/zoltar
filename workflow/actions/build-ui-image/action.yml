name: Build UI image
description: Name the repository image, log in to its registry, and build a UI Dockerfile target into the local Docker daemon
inputs:
  registry:
    description: Container registry host.
    required: true
  tag:
    description: Image tag appended to the lowercase repository image name.
    required: true
  file:
    description: Dockerfile path.
    required: true
  target:
    description: Dockerfile target stage; empty builds the final stage.
    required: false
    default: ""
  cache-scope:
    description: GitHub Actions build cache scope.
    required: true
outputs:
  image-name:
    description: Lowercase registry image name without a tag.
    value: ${{ steps.metadata.outputs.image-name }}
  image:
    description: Built image reference including its tag.
    value: ${{ steps.metadata.outputs.image }}
runs:
  using: composite
  steps:
    - name: Set image metadata
      id: metadata
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_TAG: ${{ inputs.tag }}
      run: |
        IMAGE_NAME="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
        echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        build-args: BUN_VERSION=${{ env.BUN_VERSION }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        context: .
        file: ${{ inputs.file }}
        load: true
        target: ${{ inputs.target }}
        tags: ${{ steps.metadata.outputs.image }}
