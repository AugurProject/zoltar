name: Production Browser Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  FOUNDRY_VERSION: v1.5.1

jobs:
  browser-smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
      - name: Run production browser smoke tier
        run: bun run test:browser:smoke

  browser-workflow:
    name: Production browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
      - name: Run production browser workflow tier
        run: bun run test:browser:workflow
