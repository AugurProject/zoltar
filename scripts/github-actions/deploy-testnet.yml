name: Deploy Testnet Contracts

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Public HTTPS RPC URL for the target testnet
        required: true
        type: string
      chain_id:
        default: "11155111"
        description: Decimal chain ID for an EIP-1559, Cancun, and Osaka-compatible testnet
        required: true
        type: string
      max_fee_per_gas_gwei:
        default: "100"
        description: Maximum authorized fee per gas in gwei
        required: true
        type: string
      max_total_cost_eth:
        default: "10"
        description: Maximum worst-case deployment cost in testnet ETH
        required: true
        type: string
      confirm:
        description: Type DEPLOY to authorize onchain transactions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testnet-contract-deployment-${{ inputs.chain_id }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  deploy:
    name: Deploy contracts
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    environment: testnet-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd solidity && bun install --frozen-lockfile)
          (cd ui && bun install --frozen-lockfile)

      - name: Prepare contract artifacts
        run: bun run ensure-contract-artifacts

      - name: Deploy deterministic infrastructure
        env:
          CHAIN_ID: ${{ inputs.chain_id }}
          MAX_FEE_PER_GAS_GWEI: ${{ inputs.max_fee_per_gas_gwei }}
          MAX_TOTAL_COST_ETH: ${{ inputs.max_total_cost_eth }}
          PRIVATE_KEY: ${{ secrets.TESTNET_DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ inputs.rpc_url }}
        run: bun run deploy:testnet
