services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: augurscan
      POSTGRES_USER: augurscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-augurscan-local}
    volumes:
      - augurscan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augurscan -d augurscan"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  app:
    build:
      context: ..
      dockerfile: augurScan/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://augurscan:${POSTGRES_PASSWORD:-augurscan-local}@postgres:5432/augurscan
      PORT: 3000
      NETWORKS: ${NETWORKS:-mainnet,sepolia}
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://mainnet.gateway.tenderly.co}
      MAINNET_START_BLOCK: ${MAINNET_START_BLOCK:-0}
      MAINNET_AMM_FACTORY_ADDRESS: ${MAINNET_AMM_FACTORY_ADDRESS:-}
      MAINNET_UNISWAP_V2_FACTORY_ADDRESS: ${MAINNET_UNISWAP_V2_FACTORY_ADDRESS-0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f}
      MAINNET_UNISWAP_V3_FACTORY_ADDRESS: ${MAINNET_UNISWAP_V3_FACTORY_ADDRESS-0x1F98431c8aD98523631AE4a59f267346ea31F984}
      MAINNET_UNISWAP_V4_POOL_MANAGER_ADDRESS: ${MAINNET_UNISWAP_V4_POOL_MANAGER_ADDRESS-0x000000000004444c5dc75cB358380D2e3dE08A90}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://sepolia.gateway.tenderly.co}
      SEPOLIA_START_BLOCK: ${SEPOLIA_START_BLOCK:-0}
      SEPOLIA_AMM_FACTORY_ADDRESS: ${SEPOLIA_AMM_FACTORY_ADDRESS:-}
      SEPOLIA_UNISWAP_V2_FACTORY_ADDRESS: ${SEPOLIA_UNISWAP_V2_FACTORY_ADDRESS:-}
      SEPOLIA_UNISWAP_V3_FACTORY_ADDRESS: ${SEPOLIA_UNISWAP_V3_FACTORY_ADDRESS-0x0227628f3F023bb0B980b67D528571c95c6DaC1c}
      SEPOLIA_UNISWAP_V4_POOL_MANAGER_ADDRESS: ${SEPOLIA_UNISWAP_V4_POOL_MANAGER_ADDRESS:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-12000}
      LOG_SCAN_RANGE_SIZE: ${LOG_SCAN_RANGE_SIZE:-2000}
    ports:
      - "${AUGURSCAN_PORT:-3000}:3000"
    stop_grace_period: 30s

volumes:
  augurscan-data:
