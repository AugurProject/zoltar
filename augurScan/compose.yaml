services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    command: ["postgres", "-c", "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: augurscan
      POSTGRES_USER: augurscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-augurscan-local}
    volumes:
      - augurscan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augurscan -d augurscan"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 60s

  app:
    build:
      context: ..
      dockerfile: augurScan/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://augurscan:${POSTGRES_PASSWORD:-augurscan-local}@postgres:5432/augurscan}
      PORT: 3000
      DISABLE_INDEXER: 1
      NETWORKS: ${NETWORKS:-mainnet,sepolia}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-12000}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - "${AUGURSCAN_PORT:-3000}:3000"
    stop_grace_period: 60s

  indexer:
    build:
      context: ..
      dockerfile: augurScan/Dockerfile
    command: ["bun", "augurScan/src/indexer-process.ts"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://augurscan:${POSTGRES_PASSWORD:-augurscan-local}@postgres:5432/augurscan}
      DISABLE_INDEXER: ${DISABLE_INDEXER:-0}
      NETWORKS: ${NETWORKS:-mainnet,sepolia}
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://mainnet.gateway.tenderly.co}
      MAINNET_START_BLOCK: ${MAINNET_START_BLOCK:-0}
      MAINNET_AMM_FACTORY_ADDRESS: ${MAINNET_AMM_FACTORY_ADDRESS:-}
      MAINNET_UNISWAP_V2_FACTORY_ADDRESS: ${MAINNET_UNISWAP_V2_FACTORY_ADDRESS:-}
      MAINNET_UNISWAP_V3_FACTORY_ADDRESS: ${MAINNET_UNISWAP_V3_FACTORY_ADDRESS:-}
      MAINNET_UNISWAP_V4_POOL_MANAGER_ADDRESS: ${MAINNET_UNISWAP_V4_POOL_MANAGER_ADDRESS:-}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://sepolia.gateway.tenderly.co}
      SEPOLIA_START_BLOCK: ${SEPOLIA_START_BLOCK:-0}
      SEPOLIA_AMM_FACTORY_ADDRESS: ${SEPOLIA_AMM_FACTORY_ADDRESS:-}
      SEPOLIA_UNISWAP_V2_FACTORY_ADDRESS: ${SEPOLIA_UNISWAP_V2_FACTORY_ADDRESS:-}
      SEPOLIA_UNISWAP_V3_FACTORY_ADDRESS: ${SEPOLIA_UNISWAP_V3_FACTORY_ADDRESS:-}
      SEPOLIA_UNISWAP_V4_POOL_MANAGER_ADDRESS: ${SEPOLIA_UNISWAP_V4_POOL_MANAGER_ADDRESS:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-12000}
      LOG_SCAN_RANGE_SIZE: ${LOG_SCAN_RANGE_SIZE:-100000}
      TRACE_SELECTED_TRANSACTIONS: ${TRACE_SELECTED_TRANSACTIONS:-0}
      RPC_LOG_PATH: /var/log/augurscan/rpc.jsonl
    volumes:
      - augurscan-logs:/var/log/augurscan
    stop_grace_period: 60s

volumes:
  augurscan-data:
  augurscan-logs:

networks:
  default:
    name: zoltar
    external: true
