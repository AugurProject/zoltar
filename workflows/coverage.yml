name: Coverage

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "shared/ts/**"
      - "solidity/ts/**"
      - "ui/**/ts/**"
      - ".coverage-policy.json"
      - "scripts/coverage-report.mts"
      - "scripts/run-typescript-coverage.mts"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.14
  FOUNDRY_VERSION: v1.5.1

jobs:
  coverage:
    name: ${{ github.event_name == 'pull_request' && 'Changed TypeScript coverage' || 'Full coverage policy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Run pull-request TypeScript coverage gate
        if: github.event_name == 'pull_request'
        run: bun run coverage:fast
      - name: Run scheduled TypeScript and Solidity coverage gates
        if: github.event_name != 'pull_request'
        run: bun run coverage:full
      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.md ]]; then
            cat coverage/coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Coverage summary was not produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage
            solidity/coverage
          if-no-files-found: warn
          retention-days: 14

