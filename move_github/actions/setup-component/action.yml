name: Set up component CI
description: Install one component from its lockfile and restore its local cache

inputs:
  directory:
    description: Component package directory
    required: true
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Read canonical project metadata
      id: projects
      shell: bash
      run: bun ./tooling/repo/query-projects.mts --github-output

    - name: Cache component dependencies
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-component-${{ inputs.directory }}-${{ env.BUN_VERSION }}-${{ steps.projects.outputs.dependency_cache_key }}

    - name: Install local dependency inputs
      shell: bash
      run: |
        bun ./tooling/repo/run-project-tasks.mts setup repository
        bun ./tooling/repo/run-project-tasks.mts setup --project-path "${{ inputs.directory }}" --dependencies
