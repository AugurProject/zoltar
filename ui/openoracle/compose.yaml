name: zoltar-openoracle

services:
  openoracle:
    build:
      context: ../..
      dockerfile: ui/Dockerfile
      target: local-runtime-openoracle
    image: zoltar-openoracle
    ports:
      - 127.0.0.1:4173:4173
    environment:
      UI_APP: openoracle

networks:
  default:
    name: zoltar
    external: true
